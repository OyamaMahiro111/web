<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML运行器示例</title>
    <style>
        body{font-family:Arial,Microsoft YaHei;padding:24px;background:#f7f9fc;}
        .card{max-width:520px;margin:0 auto;background:#fff;border-radius:10px;padding:20px;box-shadow:0 6px 18px rgba(0,0,0,.08);}
        h1{font-size:24px;color:#1d2939;margin:0 0 10px;}
        p{font-size:14px;color:#475467;line-height:1.8;}
        button{background:#1677ff;color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;}
    </style>
</head>
<body>
    <div class="card">
        <h1>在线HTML运行器</h1>
        <p>这是一个示例页面，你可以直接修改这段代码并再次运行。</p>
        <button onclick="document.body.style.background='#eef4ff'">点击切换背景</button>
    </div>
</body>
</html>
